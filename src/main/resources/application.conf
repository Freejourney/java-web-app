# Akka reads application.conf through Typesafe Config. Spring Boot keeps using
# application.properties; the two files do not overlap.
akka {
  # Route actor logging through the SLF4J backend already used by Spring Boot.
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  stdout-loglevel = "WARNING"
}