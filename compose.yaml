services:
  app:
    build: .
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    volumes:
      - inventory-data:/app/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/inventory.db
    restart: unless-stopped

volumes:
  inventory-data:
